# Tsuzuki stable releases: pushing a tag vX.Y.Z builds the release APKs (no telemetry, updater on), signs them with
# the owner's key and publishes a GitHub release marked "latest", which installed release builds find through
# Settings → About → Check for updates. Preview builds (tsuzuki-preview.yml, tags rNNNN) are pre-releases, so they
# never become "latest". Push only the one tag (`git push origin vX.Y.Z`), never `--tags`: the repo still holds
# Tsundoku's old v0.x tags.
name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Manojx2005/Tsuzuki'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history, for the commit count)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check the tag matches versionName
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          name=$(grep -E '^\s*versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ "v$name" != "$tag" ]; then
            echo "Tag $tag does not match versionName $name in app/build.gradle.kts" >&2
            exit 1
          fi

      - name: Build and sign release APKs (no telemetry)
        env:
          TSUZUKI_GITHUB_RELEASE: 'true'
          storeFileBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        # Never add -Pinclude-telemetry: PRIVACY.md promises no telemetry.
        run: ./gradlew :app:assembleRelease -Penable-updater

      - name: Check no telemetry code shipped
        run: |
          set -e
          apk=app/build/outputs/apk/release/app-universal-release.apk
          if unzip -p "$apk" 'classes*.dex' | grep -a -q 'Lcom/google/firebase/'; then
            echo "Firebase classes found in $apk; release builds must not include telemetry" >&2
            exit 1
          fi

      - name: Rename APKs
        run: |
          set -e
          cd app/build/outputs/apk/release
          tag="${GITHUB_REF_NAME}"
          mv app-universal-release.apk "tsuzuki-$tag.apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mv "app-$abi-release.apk" "tsuzuki-$abi-$tag.apk"
          done
          ls -la

      - name: Write release notes
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # The matching CHANGELOG.md section, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi
          # Checksums go in the notes, not as an asset: the updater treats any asset without an ABI in its name as
          # the universal APK.
          {
            echo
            echo '### SHA-256'
            echo '```'
            (cd app/build/outputs/apk/release && sha256sum tsuzuki-*.apk)
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" app/build/outputs/apk/release/tsuzuki-*.apk \
            --title "Tsuzuki $tag" --notes-file notes.md --verify-tag --latest
