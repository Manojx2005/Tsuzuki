<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&amp;family=Space+Mono:wght@400;700&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pill{height:40px;padding:0 16px;border-radius:20px;border:1px solid #2A2A2A;background:#111;color:#fff;font:700 12px/1 'Space Mono',monospace;letter-spacing:1px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.cnt{font:400 11px/1 'Space Mono',monospace;color:#8A8A8A}
.ib{width:48px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:24px;padding:0}
.nav{flex:1 1 0;min-width:0;height:48px;border:0;border-radius:24px;background:transparent;color:#8A8A8A;font:700 11px/1 'Space Mono',monospace;letter-spacing:.6px;padding:0}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#000;font-family:'Space Mono',monospace;color:#fff;background-image:radial-gradient(#1C1C1C 1px,transparent 1.2px);background-size:12px 12px;background-position:6px 6px">
  <header style="padding:20px 8px 0 20px;display:flex;align-items:center;gap:4px">
    <h1 style="margin:0;flex:1;font:900 40px/1 'Doto',monospace;letter-spacing:1px">LIBRARY</h1>
    <button class="ib" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="ib" aria-label="Filter and sort"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M3 6h18M7 12h10M10 18h4"/></svg></button>
    <button class="ib" aria-label="More options"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>
  <div style="padding:6px 20px 0" class="cnt">4 NOVELS · 141 MANGA</div>

  <div style="padding:16px 16px 0;display:flex;gap:8px" role="tablist" aria-label="Media">
    <button class="pill" role="tab" aria-selected="true" style="background:#FF2D2D;border-color:#FF2D2D">ALL</button>
    <button class="pill" role="tab" aria-selected="false">NOVELS</button>
    <button class="pill" role="tab" aria-selected="false">MANGA</button>
  </div>
  <div style="padding:10px 16px 0;display:flex;gap:8px;overflow:hidden" role="tablist" aria-label="Shelves">
    <button class="pill" role="tab" aria-selected="true" style="background:#fff;color:#000;border-color:#fff">DEFAULT <span class="cnt" style="color:#555">145</span></button>
    <button class="pill" role="tab" aria-selected="false">LOCAL <span class="cnt">0</span></button>
  </div>

  <div style="padding:18px 16px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px">
    <sc-for list="{{books}}" as="b" hint-placeholder-count="6">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <div style="position:relative;aspect-ratio:2/3;border-radius:14px;background:{{b.g}};border:1px solid #262626">
          <span style="position:absolute;top:6px;left:6px;height:20px;padding:0 6px;border-radius:6px;background:#FF2D2D;font:700 10px/20px 'Space Mono',monospace">{{b.kind}}</span>
          <sc-if value="{{b.hasUnread}}" hint-placeholder-val="{{true}}"><span style="position:absolute;top:6px;right:6px;height:20px;padding:0 6px;border-radius:6px;background:#000;border:1px solid #333;font:700 10px/20px 'Space Mono',monospace">{{b.unread}}</span></sc-if>
        </div>
        <div style="font:700 11px/1.35 'Space Mono',monospace;letter-spacing:.6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{b.t}}</div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position:absolute;left:16px;right:16px;bottom:20px;height:62px;border-radius:31px;background:#111;border:1px solid #2A2A2A;box-sizing:border-box;padding:0 6px;display:flex;align-items:center">
    <div aria-hidden="true" style="position:absolute;left:79px;top:6px;width:64px;height:48px;border-radius:24px;background:#fff"></div>
    <button class="nav" style="position:relative">HOME</button>
    <button class="nav" aria-current="page" style="position:relative;color:#000">LIBRARY</button>
    <button class="nav" style="position:relative">UPDATES</button>
    <button class="nav" style="position:relative">BROWSE</button>
    <button class="nav" style="position:relative">MORE</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const g = ['#2B2B2B','#3A3A3A','#232323','#333333','#292929','#3E3E3E'];
    const books = [
      { t: 'LORD OF THE MYSTERIES', kind: 'LN', unread: '1400' },
      { t: 'SHADOW SLAVE', kind: 'LN', unread: '2237' },
      { t: 'REVEREND INSANITY', kind: 'LN', unread: '2334' },
      { t: 'LORD OF MYSTERIES 2: CIRCLE OF INEVITABILITY', kind: 'LN', unread: '1181' },
      { t: 'NANO MACHINE', kind: 'MANGA', unread: '' },
      { t: "THE ACADEMY'S GENIUS SWORDSMAN", kind: 'MANGA', unread: '' }
    ].map((b, i) => ({ ...b, g: g[i], hasUnread: b.unread !== '' }));
    return { books };
  }
}
</script>
</body>
</html>
