<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End of chapter (Colour)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.line{height:12px;border-radius:6px;background:#D9CCB6}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{page}};font-family:'Manrope',sans-serif;color:{{ink}}">
  <div style="position:absolute;top:40px;left:16px;right:16px;display:flex;flex-direction:column;gap:14px" aria-hidden="true">
    <div class="line" style="width:100%"></div><div class="line" style="width:90%"></div><div class="line" style="width:97%"></div><div class="line" style="width:55%"></div>
    <div style="height:10px"></div>
    <div class="line" style="width:100%"></div><div class="line" style="width:82%"></div>
  </div>

  <div style="position:absolute;top:250px;left:16px;right:16px;display:flex;align-items:center;gap:12px" aria-hidden="true">
    <div style="flex:1;height:1px;background:{{rule}}"></div>
    <div style="font:italic 400 18px/1 'Instrument Serif',serif;color:{{muted}}">End of chapter 33</div>
    <div style="flex:1;height:1px;background:{{rule}}"></div>
  </div>

  <div style="position:absolute;top:296px;left:16px;right:16px;background:{{tile}};border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font:700 12px/1 'Manrope',sans-serif;letter-spacing:.4px;color:{{muted}}">Up next</div>
      <div style="font:italic 400 40px/1 'Instrument Serif',serif;color:{{ink}}">Chapter 34</div>
      <div style="font:600 15px/1.35 'Manrope',sans-serif;color:{{ink}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">[Chapter 34 title from source]</div>
      <div style="display:flex;gap:6px;align-items:center;font:700 12px/1 'Manrope',sans-serif;color:{{muted}};margin-top:2px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>Downloaded
      </div>
    </div>
    <button style="height:56px;border:0;border-radius:28px;background:{{ink}};color:{{page}};font:800 15px/1 'Manrope',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px">Next chapter
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div style="display:flex;gap:8px">
      <button style="flex:1;height:48px;border:1.5px solid {{rule}};border-radius:24px;background:transparent;color:{{ink}};font:700 14px/1 'Manrope',sans-serif">Mark read</button>
      <button style="flex:1;height:48px;border:1.5px solid {{rule}};border-radius:24px;background:transparent;color:{{ink}};font:700 14px/1 'Manrope',sans-serif">Contents</button>
    </div>
  </div>
  <div style="position:absolute;bottom:40px;left:0;right:0;text-align:center;font:600 13px/1.4 'Manrope',sans-serif;color:{{muted}}">Pull up to continue</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pageColour":{"editor":"enum","options":["Sepia","Paper","Sage","Night","Black"],"default":"Sepia"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      Sepia: { page: '#F3EADB', ink: '#3A2E22', muted: '#6B5A45', tile: '#E8DCC6', rule: '#C9B89D' },
      Paper: { page: '#FAF8F3', ink: '#1F1F1F', muted: '#5C5C5C', tile: '#EFECE4', rule: '#CFCBC0' },
      Sage:  { page: '#DCE5D6', ink: '#24301F', muted: '#4D5C47', tile: '#CDD9C5', rule: '#A9B9A0' },
      Night: { page: '#1D1A16', ink: '#E6DDCD', muted: '#A99E8C', tile: '#2A2621', rule: '#4A433A' },
      Black: { page: '#000000', ink: '#E2E2E2', muted: '#9A9A9A', tile: '#151515', rule: '#3A3A3A' }
    };
    return P[this.props.pageColour ?? 'Sepia'] || P.Sepia;
  }
}
</script>
</body>
</html>
