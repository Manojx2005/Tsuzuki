<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reader quick settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&amp;family=Space+Mono:wght@400;700&amp;family=Literata:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lab{font:700 11px/1 'Space Mono',monospace;letter-spacing:1.2px;color:#8A8A8A}
.seg{flex:1 1 0;height:40px;border:0;border-radius:20px;background:transparent;color:#8A8A8A;font:700 12px/1 'Space Mono',monospace;letter-spacing:1px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;color:#fff;font:700 10px/1 'Space Mono',monospace;letter-spacing:.8px;min-width:0}
.dot{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font:500 17px/1 'Literata',serif;box-sizing:border-box}
.chip{flex:1 1 0;min-width:0;height:44px;border-radius:22px;border:1px solid #2A2A2A;background:#111;color:#fff;font:500 14px/1 'Literata',serif}
.stp{width:44px;height:44px;border-radius:22px;border:0;background:#1E1E1E;color:#fff;font:700 18px/1 'Space Mono',monospace;flex:0 0 44px}
.line{height:12px;border-radius:6px;background:#CFC3AE}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#F3EADB;font-family:'Space Mono',monospace;color:#fff">
  <div style="position:absolute;top:28px;left:16px;right:16px;display:flex;flex-direction:column;gap:14px" aria-hidden="true">
    <div class="line" style="width:100%"></div><div class="line" style="width:92%"></div><div class="line" style="width:60%"></div>
    <div style="height:8px"></div>
    <div class="line" style="width:98%"></div><div class="line" style="width:100%"></div><div class="line" style="width:74%"></div>
  </div>
  <section aria-label="Reader settings" style="position:absolute;left:0;right:0;bottom:0;top:250px;background:#0B0B0B;border-radius:28px 28px 0 0;padding:10px 16px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
    <div style="align-self:center;width:40px;height:4px;border-radius:2px;background:#333" aria-hidden="true"></div>
    <div style="height:48px;box-sizing:border-box;padding:4px;border-radius:24px;background:#111;border:1px solid #2A2A2A;display:flex" role="tablist">
      <button class="seg" role="tab" aria-selected="true" style="background:#fff;color:#000">TEXT</button>
      <button class="seg" role="tab" aria-selected="false">PAGE</button>
      <button class="seg" role="tab" aria-selected="false">CONTROLS</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="lab">PAGE COLOUR</span>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px" role="radiogroup" aria-label="Page colour">
        <button class="sw" role="radio" aria-checked="false"><span class="dot" style="background:#2B2118;color:#F3EADB">Aa</span>BOOK</button>
        <button class="sw" role="radio" aria-checked="false"><span class="dot" style="background:#FAF8F3;color:#222">Aa</span>PAPER</button>
        <button class="sw" role="radio" aria-checked="true"><span class="dot" style="background:#F3EADB;color:#4A3B2A;outline:2px solid #fff;outline-offset:3px">Aa</span>SEPIA</button>
        <button class="sw" role="radio" aria-checked="false"><span class="dot" style="background:#DCE5D6;color:#2E3A2A">Aa</span>SAGE</button>
        <button class="sw" role="radio" aria-checked="false"><span class="dot" style="background:#1D1A16;color:#D8CFC0;border:1px solid #333">Aa</span>NIGHT</button>
        <button class="sw" role="radio" aria-checked="false"><span class="dot" style="background:#000;color:#ddd;border:1px solid #333">Aa</span>BLACK</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="lab">FONT</span>
      <div style="display:flex;gap:8px" role="radiogroup" aria-label="Font">
        <button class="chip" role="radio" aria-checked="true" style="background:#fff;color:#000;border-color:#fff">Literata</button>
        <button class="chip" role="radio" aria-checked="false" style="font-family:Georgia,serif">Serif</button>
        <button class="chip" role="radio" aria-checked="false" style="font-family:Arial,sans-serif">Sans</button>
        <button class="chip" role="radio" aria-checked="false" style="font-family:'Space Mono',monospace">Mono</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <div style="background:#0D0D0D;border:1px solid #262626;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px">
        <span class="lab">TEXT SIZE</span>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <button class="stp" aria-label="Smaller text">A−</button>
          <span style="font:900 26px/1 'Doto',monospace;color:#FF2D2D">13</span>
          <button class="stp" aria-label="Larger text">A+</button>
        </div>
      </div>
      <div style="background:#0D0D0D;border:1px solid #262626;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px">
        <span class="lab">LINE SPACING</span>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <button class="stp" aria-label="Tighter lines">−</button>
          <span style="font:900 26px/1 'Doto',monospace;color:#FF2D2D">1.1×</span>
          <button class="stp" aria-label="Looser lines">+</button>
        </div>
      </div>
    </div>

    <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center">
      <button style="height:44px;padding:0 14px;border-radius:22px;border:1px solid #2A2A2A;background:transparent;color:#fff;font:700 11px/1 'Space Mono',monospace;letter-spacing:1px">RESET</button>
      <a href="ReaderAll.dc.html" style="height:44px;display:flex;align-items:center;gap:8px;color:#FF2D2D;text-decoration:none;font:700 12px/1 'Space Mono',monospace;letter-spacing:1px">ALL READER SETTINGS <span aria-hidden="true">›</span></a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
